<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat · Sourcebound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css?v=2" />
  <script>
    window.APP_CONFIG = { BACKEND_URL: "http://127.0.0.1:8000" };
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("sourcebound:settings") || "{}");
        if (s.theme && s.theme !== "system") document.documentElement.setAttribute("data-theme", s.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-canvas">
  <div class="flex h-screen overflow-hidden">
    <div id="sidebar-root"></div>
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
      <header id="topbar-root"></header>
      <main class="flex-1 min-h-0 px-4 md:px-8 py-4 md:py-5 flex flex-col overflow-hidden">
        <div class="max-w-4xl mx-auto w-full h-full flex-1 flex flex-col min-h-0">

          <div class="card p-3 md:p-4 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4 flex-none">
            <div class="w-9 h-9 rounded-xl bg-sunken flex items-center justify-center text-[var(--brand-600)] flex-none hidden sm:flex" id="source-type-icon"></div>
            <div class="flex-1 min-w-0">
              <select id="source-select" class="select" aria-label="Select a source to chat with"></select>
            </div>
            <div class="flex items-center gap-2 flex-none">
              <button id="clear-chat-btn" class="btn btn-secondary btn-sm" type="button">
                <span class="hidden sm:inline">Clear chat</span>
                <span class="sm:hidden">Clear</span>
              </button>
            </div>
          </div>

          <div id="source-processing-notice" class="mt-3 hidden flex-none"></div>

          <div id="chat-scroll" class="flex-1 min-h-0 overflow-y-auto mt-3 mb-3 px-1">
            <div id="chat-messages" class="flex flex-col gap-5 pb-2"></div>
            <div id="chat-empty"></div>
          </div>

          <div id="chat-error-slot" class="flex-none"></div>

          <form id="chat-form" class="composer p-2.5 flex items-end gap-2 flex-none">
            <textarea
              id="chat-input"
              class="textarea flex-1 resize-none"
              rows="1"
              maxlength="2000"
              placeholder="Ask a question about the selected source…"
              aria-label="Message"
            ></textarea>
            <button id="chat-send-btn" type="submit" class="btn btn-primary composer-send-btn" disabled aria-label="Send message" title="Send message">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </form>
          <p class="text-[11px] text-faint mt-1.5 text-center sm:text-left flex-none">Sourcebound answers only from the selected source and will say so when the answer isn't in it.</p>

        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js?v=2"></script>
  <script src="assets/js/components.js?v=2"></script>
  <script src="assets/js/navigation.js?v=2"></script>
  <script src="assets/js/app.js?v=2"></script>
  <script src="assets/js/chat.js?v=2"></script>
</body>
</html>
