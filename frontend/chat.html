<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat · Sourcebound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css?v=3" />
  <script>
    window.APP_CONFIG = { BACKEND_URL: "http://127.0.0.1:8000" };
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("sourcebound:settings") || "{}");
        if (s.theme && s.theme !== "system") document.documentElement.setAttribute("data-theme", s.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-canvas">
  <div id="modal-root"></div>
  <div class="app-shell flex overflow-hidden">
    <div id="sidebar-root"></div>
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
      <header id="topbar-root"></header>
      <main id="main-content" class="flex-1 min-h-0 flex flex-col overflow-hidden" tabindex="-1">
        <div class="w-full h-full flex-1 flex flex-col min-h-0">

          <div class="px-4 md:px-6 py-3 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4 flex-none border-b border-subtle bg-surface">
            <div class="w-9 h-9 rounded-xl bg-sunken flex items-center justify-center text-[var(--brand-600)] flex-none hidden sm:flex" id="source-type-icon"></div>
            <div class="flex-1 min-w-0 max-w-sm">
              <select id="source-select" class="select" aria-label="Select a source to chat with"></select>
            </div>
            <div class="flex items-center gap-2 flex-none ml-auto">
              <button id="clear-chat-btn" class="btn btn-secondary btn-sm" type="button">
                <span class="hidden sm:inline">Clear chat</span>
                <span class="sm:hidden">Clear</span>
              </button>
            </div>
          </div>

          <div id="source-processing-notice" class="hidden flex-none px-4 md:px-6 pt-3"></div>

          <div id="chat-scroll" class="flex-1 min-h-0 overflow-y-auto px-4 md:px-6" aria-live="off">
            <div class="max-w-3xl mx-auto w-full pt-5">
              <div id="chat-messages" class="flex flex-col gap-5 pb-2" role="log" aria-live="polite" aria-relevant="additions"></div>
              <div id="chat-empty"></div>
            </div>
          </div>

          <div class="max-w-3xl mx-auto w-full px-4 md:px-6 flex-none">
            <div id="chat-error-slot"></div>

            <form id="chat-form" class="composer p-2.5 flex items-end gap-2 mt-2 mb-2">
              <label for="chat-input" class="sr-only">Message</label>
              <textarea
                id="chat-input"
                class="textarea flex-1 resize-none"
                rows="1"
                maxlength="2000"
                placeholder="Ask a question about the selected source…"
                aria-label="Message"
              ></textarea>
              <button id="chat-send-btn" type="submit" class="btn btn-primary composer-send-btn" disabled aria-label="Send message" title="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
              </button>
            </form>
            <p class="text-[11px] text-faint mb-2 text-center sm:text-left">Sourcebound answers only from the selected source and will say so when the answer isn't in it.</p>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/components.js?v=3"></script>
  <script src="assets/js/navigation.js?v=3"></script>
  <script src="assets/js/app.js?v=3"></script>
  <script src="assets/js/chat.js?v=3"></script>
</body>
</html>
