<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search · Sourcebound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css?v=3" />
  <script>
    window.APP_CONFIG = { BACKEND_URL: "http://127.0.0.1:8000" };
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("sourcebound:settings") || "{}");
        if (s.theme && s.theme !== "system") document.documentElement.setAttribute("data-theme", s.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-canvas">
  <div class="app-shell flex overflow-hidden">
    <div id="sidebar-root"></div>
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
      <header id="topbar-root"></header>
      <main id="main-content" class="flex-1 px-4 md:px-8 py-6 md:py-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto w-full space-y-6">

          <section class="card p-4 md:p-5">
            <div id="search-form-slot"></div>
          </section>

          <section id="search-results-slot" class="space-y-3"></section>

        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/components.js?v=3"></script>
  <script src="assets/js/navigation.js?v=3"></script>
  <script src="assets/js/app.js?v=3"></script>
  <script src="assets/js/search.js?v=3"></script>
</body>
</html>
